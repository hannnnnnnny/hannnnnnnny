<!doctype html><html lang="en"><meta charset="utf-8"><title>Project capture replay</title>
<style>*{box-sizing:border-box}body{margin:0;font:18px 'Segoe UI',sans-serif;background:#f7f9fb;color:#15202e;padding:28px 42px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d9e2ea;padding-bottom:18px}h1{font-size:28px;margin:0 0 6px}small{color:#66788b;font-size:13px}nav{display:flex;gap:12px;margin:22px 0}button{font:16px 'Segoe UI',sans-serif;border:1px solid #b8c9d7;border-radius:9px;padding:12px 20px;background:white;color:#163b4d;cursor:pointer}button[aria-pressed=true]{background:#e5faf1;border-color:#278764}#screen{background:#0f1621;color:#d7e7f0;border-radius:15px;height:555px;padding:28px;overflow:hidden}pre{font:20px/1.65 Consolas,monospace;margin:14px 0;white-space:pre-wrap}#game{display:block;image-rendering:pixelated;height:100%;max-width:100%;margin:auto}#screen.game{padding:12px}footer{font-size:14px;color:#62748a;margin-top:17px}.cmd{color:#7cf6ce}.status{color:#b6c9dc;font-size:15px}</style>
<header><div><h1 id="title"></h1><small id="subtitle"></small></div><small>PROJECT WALKTHROUGH</small></header><nav id="nav"></nav><main id="screen"></main><footer id="foot"></footer>
<script>
const game=new URLSearchParams(location.search).get('project')==='game';
const screen=document.querySelector('#screen');
function button(label,action){const el=document.createElement('button');el.textContent=label;el.setAttribute('aria-pressed','false');el.onclick=()=>{document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));el.setAttribute('aria-pressed','true');action();};document.querySelector('#nav').append(el);return el;}
if(game){document.querySelector('#title').textContent='Ashen Depths / ARPG-CX';document.querySelector('#subtitle').textContent='Recorded gameplay and build menus from the project repository';screen.className='game';const img=document.createElement('img');img.id='game';img.alt='Original desktop game capture';screen.append(img);button('Gameplay',()=>img.src='../../output/playwright/recordings/gameplay-source.gif').click();button('Build menus',()=>img.src='../../output/playwright/recordings/menus-source.gif');document.querySelector('#foot').textContent='Original game capture replay. Mouse controls this viewer; it is not live gameplay.';}
else{document.querySelector('#title').textContent='GuardRun';document.querySelector('#subtitle').textContent='Real offline CLI output · replay of examples/offline_demo.py';fetch('../../output/playwright/recordings/guardrun-output.json').then(r=>{if(!r.ok)throw Error('Transcript unavailable');return r.json();}).then(stages=>{const commands=['read_file notes.md','read_file .env','run_shell rm notes.md'];['Normal read','Secret read','Approval gate'].forEach((label,i)=>button(label,()=>{screen.replaceChildren();const cmd=document.createElement('pre');cmd.className='cmd';cmd.textContent='> '+commands[i];const out=document.createElement('pre');out.textContent=stages[i].join('\n');screen.append(cmd,out);}));document.querySelector('button').click();}).catch(error=>screen.textContent=error.message);document.querySelector('#foot').textContent='Scripted model provider; real sandbox and approval checks. No model API call or real secret used.';}
</script></html>
